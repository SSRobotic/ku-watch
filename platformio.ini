[platformio]
default_envs = display_first

[env:display_first]
platform = espressif32@7.1.1
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<main.cpp>
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
board_upload.flash_size = 4MB
board_upload.maximum_size = 1572864
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio
board_build.embed_files = tools/certs/x509_crt_bundle
extra_scripts =
  pre:tools/build_stamp.py
  post:tools/short_paths.py
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=0
lib_deps =
  https://github.com/adafruit/Adafruit_GC9A01A/archive/refs/tags/1.1.1.zip
  adafruit/Adafruit GFX Library@1.12.4
  adafruit/Adafruit BusIO@1.17.4
  boschsensortec/BME68x Sensor library@1.3.40408
  https://github.com/boschsensortec/Bosch-BSEC2-Library/archive/refs/tags/1.10.2610.zip
  https://github.com/sparkfun/SparkFun_MAX3010x_Sensor_Library.git
  knolleary/PubSubClient@^2.8
  mikalhart/TinyGPSPlus@1.1.0

[env:display_test]
extends = env:display_first
build_src_filter = +<display_test.cpp>

[env:espnow_bridge_test]
extends = env:display_first
build_src_filter = +<espnow_bridge_test.cpp>
lib_deps =

[env:button_test]
 extends = env:display_first
 build_src_filter = +<button_test.cpp>

[env:max30102_test]
extends = env:display_first
build_src_filter = +<max30102_test.cpp>
lib_deps =
  https://github.com/sparkfun/SparkFun_MAX3010x_Sensor_Library.git

[env:gy51_test]
extends = env:display_first
build_src_filter = +<gy51_test.cpp>

[env:gps_test]
extends = env:display_first
build_src_filter = +<gps_test.cpp>
lib_deps =
  mikalhart/TinyGPSPlus@1.1.0
